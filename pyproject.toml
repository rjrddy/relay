[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "relay-workflow-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["ruff==0.17.1", "playwright==1.64.0"]
[tool.setuptools]
py-modules = ["relay_sdk"]
package-dir = {"" = "sdk/python"}
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
